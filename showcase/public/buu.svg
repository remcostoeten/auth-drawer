<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Body (fat round shape) -->
  <ellipse cx="100" cy="120" rx="60" ry="65" fill="#FF9ECF"/>
  <!-- Head -->
  <circle cx="100" cy="60" r="45" fill="#FFB5D6"/>
  <!-- Antenna -->
  <line x1="100" y1="15" x2="100" y2="-5" stroke="#FF9ECF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="-8" r="5" fill="#FF9ECF"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="55" rx="8" ry="10" fill="#222"/>
  <ellipse cx="118" cy="55" rx="8" ry="10" fill="#222"/>
  <!-- Eye shine -->
  <circle cx="79" cy="51" r="3" fill="white"/>
  <circle cx="115" cy="51" r="3" fill="white"/>
  <!-- Mouth (big grin) -->
  <path d="M 70 75 Q 100 100 130 75" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Cape -->
  <path d="M 45 95 Q 30 140 40 180 Q 100 195 160 180 Q 170 140 155 95" fill="#7B2D8E" opacity="0.8"/>
  <!-- Belly -->
  <ellipse cx="100" cy="130" rx="40" ry="35" fill="#FFB5D6"/>
  <!-- Belt/outfit -->
  <rect x="55" y="115" width="90" height="12" rx="6" fill="#222"/>
  <circle cx="100" cy="121" r="5" fill="#FFD700"/>
  <!-- Wrist bands -->
  <rect x="35" y="95" width="10" height="30" rx="3" fill="#222"/>
  <rect x="155" y="95" width="10" height="30" rx="3" fill="#222"/>
</svg>
