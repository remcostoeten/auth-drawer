services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: passport_demo
      POSTGRES_PASSWORD: passport_demo
      POSTGRES_DB: passport_demo
    volumes:
      - passport_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passport_demo -d passport_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  passport_demo_postgres:
