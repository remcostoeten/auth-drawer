services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: custom_jwt
      POSTGRES_PASSWORD: custom_jwt
      POSTGRES_DB: custom_jwt
    volumes:
      - custom_jwt_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custom_jwt -d custom_jwt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  custom_jwt_postgres:
